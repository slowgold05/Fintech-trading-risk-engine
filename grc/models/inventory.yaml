status: draft
approval: Pending model owner review
method: Each scenario is labeled fire or do-not-fire before the detector runs. Precision
  is true positives divided by alerts. Recall is true positives divided by labeled
  positives. Surveillance scenarios live in grc/surveillance/scenarios. AML scenarios
  are hand-labeled JSON in grc/aml/scenarios. They are not an AMLSim graph export.
models:
