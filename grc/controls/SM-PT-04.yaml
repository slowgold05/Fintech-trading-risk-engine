id: SM-PT-04
title: Trade-entry retry deduplication
objective: Prevent repeated order or direct-trade requests with the same user key from creating a second execution.
type: preventive and detective, automated
owner: Trading Operations (first line)
frequency: per request and daily
test: python -m app.scripts.run_controls; tests/test_orders.py and tests/test_trades.py
evidence: grc/evidence/SM-PT-04/<run-id>.json
threshold: User/key uniqueness enforced and every committed request has a saved response.
mappings: {}
risks:
  - Duplicate paper trades after a network retry
